name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Package (macOS arm64)
    runs-on: macos-14

    # secrets 컨텍스트는 step 의 if: 에서 쓸 수 없다(GitHub 표현식 컨텍스트 제약).
    # job 수준 env 로 끌어올려 env.X != '' 로 판정한다.
    env:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
      NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
      NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect environment
        run: |
          sw_vers
          uname -m
          swift --version

      # Developer ID Application 인증서가 시크릿에 있으면 키체인에 설치한다.
      # 없으면 build_app.sh 가 ad-hoc 으로 서명하고, DMG 는 공증 없이 만들어진다.
      - name: Import Developer ID certificate
        if: env.MACOS_CERTIFICATE_P12 != ''
        run: |
          set -euo pipefail
          KEYCHAIN=build.keychain
          KEYCHAIN_PASSWORD=actions
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          rm -f /tmp/cert.p12
          echo "설치된 서명 자격증명:"
          security find-identity -v -p codesigning

      - name: Build Application Bundle
        run: |
          chmod +x ./scripts/build_app.sh
          ./scripts/build_app.sh

      - name: Create ZIP archive (자동 업데이트용)
        run: |
          # ditto 를 쓴다: 확장 속성·리소스 포크를 보존하고, UpdateManager 가
          # 내려받은 zip 을 푸는 방식(ditto -xk)과 대칭이다.
          ZIP_NAME="OhMyFriend-macOS-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent OhMyFriend.app "${ZIP_NAME}"
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

      - name: Create DMG (드래그 설치용)
        run: |
          chmod +x ./scripts/make_dmg.sh
          ./scripts/make_dmg.sh

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OhMyFriend-macOS-arm64
          path: |
            OhMyFriend-macOS-arm64.zip
            OhMyFriend-macOS-arm64.dmg
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            OhMyFriend-macOS-arm64.zip
            OhMyFriend-macOS-arm64.dmg
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Rolling Release (latest)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build (main)
          files: |
            OhMyFriend-macOS-arm64.zip
            OhMyFriend-macOS-arm64.dmg
          generate_release_notes: true
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain build.keychain 2>/dev/null || true
